version: "3.9"

services:
  backend:
    build:
      context: ./email
    container_name: fastapi-backend
    environment:
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - CORS_ORIGINS=https://ruiribeiro.dev,https://www.ruiribeiro.dev
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./portefolio-front
      args:
        REACT_APP_API_HOST: /api
    container_name: react-frontend
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      - backend
    restart: unless-stopped
